<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Watermark Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-attachment: fixed;
            transition: background 0.5s ease;
        }

        /* Light Mode Background */
        body:not(.dark) {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 50%, #f3e8ff 100%);
        }

        /* Dark Mode Background */
        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #312e81 50%, #4c1d95 100%);
        }

        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        .dark input[type=range]::-webkit-slider-thumb {
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 4px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
        }

        input[type=color] {
            -webkit-appearance: none;
            border: none;
            border-radius: 8px;
            width: 100%;
            height: 44px; /* Touch friendly height */
            padding: 0;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }
        .dark input[type=color] {
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        input[type=color]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type=color]::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
        }
        
        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
            transition: all 0.5s ease;
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #1e293b;
            transition: all 0.3s ease;
        }
        .dark .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .glass-input:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 4px;
        }
        
        /* Canvas grabbing styles */
        #canvas {
            cursor: grab;
        }
        #canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 dark:text-slate-100 p-4 md:p-8 flex items-center justify-center">

    <main class="w-full max-w-7xl glass-panel rounded-3xl overflow-hidden flex flex-col lg:flex-row shadow-2xl relative">
        
        <!-- Theme Toggle Button -->
        <button id="themeToggle" class="absolute top-4 right-4 z-50 p-2 rounded-full bg-white/20 dark:bg-black/20 backdrop-blur-md border border-black/5 dark:border-white/10 text-slate-700 dark:text-yellow-300 hover:scale-110 transition-transform">
            <!-- Sun Icon -->
            <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <!-- Moon Icon -->
            <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>

        <!-- Left Section: Image Preview & Dropzone -->
        <div class="w-full lg:w-3/5 p-4 sm:p-6 flex flex-col border-b lg:border-b-0 lg:border-r border-black/5 dark:border-white/10 relative">
            
            <header class="mb-4 sm:mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-300 dark:to-purple-300">
                    Watermark Studio
                </h1>
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button id="removeImageBtn" class="hidden cursor-pointer bg-rose-500 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-lg shadow-rose-500/30 flex items-center justify-center gap-2 w-full sm:w-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                        Clear All
                    </button>
                    <!-- MULTIPLE file input enabled here -->
                    <label for="imageUpload" class="cursor-pointer bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium transition-colors shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2 w-full sm:w-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                        <span id="uploadText">Upload Images</span>
                    </label>
                </div>
                <input type="file" id="imageUpload" accept="image/*" multiple class="hidden">
            </header>

            <!-- Drag & Drop / Canvas Container -->
            <div id="dropZone" class="relative flex-grow flex items-center justify-center bg-slate-100/50 dark:bg-black/30 rounded-2xl border-2 border-dashed border-slate-300 dark:border-white/20 transition-all duration-300 overflow-hidden min-h-[300px] lg:min-h-[400px]">
                
                <!-- Drag Overlay -->
                <div id="dragOverlay" class="absolute inset-0 z-20 bg-indigo-500/10 backdrop-blur-sm flex flex-col items-center justify-center hidden">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-indigo-500 mb-3 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-xl font-bold text-slate-700 dark:text-white">Drop Images Here</p>
                    </div>
                </div>

                <!-- Placeholder -->
                <div id="uploadPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 pointer-events-none p-6 text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-lg font-medium">Drag & Drop images here</p>
                    <p class="text-sm opacity-70 mt-1">Select multiple files at once</p>
                </div>

                <!-- Preview Canvas -->
                <canvas id="canvas" class="max-w-full max-h-full object-contain hidden z-10 shadow-lg touch-none"></canvas>
            </div>

            <!-- Thumbnail Gallery Strip -->
            <div id="thumbnailContainer" class="hidden mt-4 pt-2 border-t border-black/5 dark:border-white/10 overflow-x-auto whitespace-nowrap pb-2 flex gap-3 h-24 items-center">
                <!-- Thumbnails injected here via JS -->
            </div>
            <p id="dragHint" class="hidden text-xs text-center text-slate-500 dark:text-slate-400 mt-2">Hint: You can drag the watermark directly on the image.</p>
        </div>

        <!-- Right Section: Controls -->
        <div class="w-full lg:w-2/5 p-4 sm:p-6 lg:p-8 bg-slate-50/50 dark:bg-black/20 flex flex-col h-[500px] lg:h-auto overflow-y-auto">
            <h2 class="text-xl font-semibold mb-6 text-slate-800 dark:text-slate-200">Watermark Settings</h2>
            
            <div class="space-y-5 sm:space-y-6 flex-grow">
                
                <!-- Text Input -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Watermark Text</label>
                    <input type="text" id="watermarkText" value="© Your Brand" placeholder="Enter text..." 
                        class="w-full glass-input px-4 py-3 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                </div>

                <!-- Font Styles & Blend Modes Row -->
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="w-full sm:w-1/2 space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Font Style</label>
                        <div class="relative">
                            <select id="fontFamily" class="w-full glass-input px-4 py-3 rounded-xl appearance-none disabled:opacity-50 disabled:cursor-not-allowed font-sans" disabled>
                                <option value="Inter" selected>Inter (Modern)</option>
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Courier New">Courier New</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Impact">Impact</option>
                                <option value="Comic Sans MS">Comic Sans</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 dark:text-slate-400">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-full sm:w-1/2 space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Blend Mode</label>
                        <div class="relative">
                            <select id="blendMode" class="w-full glass-input px-4 py-3 rounded-xl appearance-none disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <option value="source-over" selected>Normal</option>
                                <option value="multiply">Multiply</option>
                                <option value="screen">Screen</option>
                                <option value="overlay">Overlay</option>
                                <option value="difference">Difference</option>
                                <option value="color-dodge">Color Dodge</option>
                                <option value="luminosity">Luminosity</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 dark:text-slate-400">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Font Size -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Font Size</label>
                        <span id="fontSizeDisplay" class="text-xs font-mono bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded text-slate-600 dark:text-slate-300">40px</span>
                    </div>
                    <input type="range" id="fontSize" min="10" max="250" value="40" class="disabled:opacity-50 disabled:cursor-not-allowed py-2" disabled>
                </div>

                <!-- Color and Opacity Row -->
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="w-full sm:w-1/3 space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Color</label>
                        <input type="color" id="fontColor" value="#ffffff" class="disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    </div>
                    
                    <div class="w-full sm:w-2/3 space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Opacity</label>
                            <span id="opacityDisplay" class="text-xs font-mono bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded text-slate-600 dark:text-slate-300">50%</span>
                        </div>
                        <input type="range" id="opacity" min="0" max="100" value="50" class="mt-2 disabled:opacity-50 disabled:cursor-not-allowed py-2" disabled>
                    </div>
                </div>

                <!-- Position -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Position / Pattern</label>
                    <div class="relative">
                        <select id="position" class="w-full glass-input px-4 py-3 rounded-xl appearance-none disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <option value="custom" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white" font-weight="bold">🎯 Custom (Drag Image)</option>
                            <option value="tiled" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white">Tiled (Repeated Background)</option>
                            <option value="center" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white" selected>Center</option>
                            <option value="bottom-right" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white">Bottom Right</option>
                            <option value="bottom-left" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white">Bottom Left</option>
                            <option value="top-right" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white">Top Right</option>
                            <option value="top-left" class="bg-white dark:bg-slate-800 text-slate-800 dark:text-white">Top Left</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 dark:text-slate-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Buttons -->
            <div class="mt-6 flex flex-col gap-3">
                <button id="downloadCurrentBtn" class="w-full bg-slate-800 hover:bg-slate-900 dark:bg-slate-200 dark:hover:bg-white text-white dark:text-slate-900 font-semibold py-3 px-6 rounded-xl shadow-lg transform transition-all duration-200 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download Current Image
                </button>
                <button id="downloadAllBtn" class="hidden w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-purple-500/30 transform transition-all duration-200 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    Download All (<span id="batchCount">0</span>)
                </button>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const dropZone = document.getElementById('dropZone');
        const dragOverlay = document.getElementById('dragOverlay');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const uploadText = document.getElementById('uploadText');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const dragHint = document.getElementById('dragHint');
        
        // Control Elements
        const watermarkText = document.getElementById('watermarkText');
        const fontSize = document.getElementById('fontSize');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const fontColor = document.getElementById('fontColor');
        const fontFamily = document.getElementById('fontFamily');
        const blendMode = document.getElementById('blendMode');
        const opacity = document.getElementById('opacity');
        const opacityDisplay = document.getElementById('opacityDisplay');
        const position = document.getElementById('position');
        const themeToggle = document.getElementById('themeToggle');
        
        // Download Buttons
        const downloadCurrentBtn = document.getElementById('downloadCurrentBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const batchCount = document.getElementById('batchCount');

        // State variables
        let uploadedImages = []; // Array to store multiple Image objects
        let currentImageIndex = 0;
        
        // Dragging State
        let isDragging = false;
        let customX = 0; 
        let customY = 0;

        const controls = [watermarkText, fontSize, fontColor, fontFamily, blendMode, opacity, position, downloadCurrentBtn, downloadAllBtn];

        // Theme Management
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        initTheme();

        function updateCanvas() {
            if (uploadedImages.length === 0) return;
            const activeImage = uploadedImages[currentImageIndex].img;

            // Clear canvas and draw active image
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over'; // Default for drawing the background image
            ctx.drawImage(activeImage, 0, 0, canvas.width, canvas.height);

            // Get settings
            const text = watermarkText.value;
            const size = parseInt(fontSize.value, 10);
            const color = fontColor.value;
            const fontStyle = fontFamily.value;
            const blend = blendMode.value;
            const alpha = parseInt(opacity.value, 10) / 100;
            const pos = position.value;

            // Setup text style
            ctx.font = `bold ${size}px '${fontStyle}', sans-serif`;
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            ctx.globalCompositeOperation = blend; // Apply user selected blend mode

            // Add drop shadow only if normal blend mode, otherwise it interferes with exotic blend modes
            if(blend === 'source-over') {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = Math.max(3, size / 8);
                ctx.shadowOffsetX = Math.max(1, size / 15);
                ctx.shadowOffsetY = Math.max(1, size / 15);
            } else {
                ctx.shadowColor = 'transparent';
            }

            // Calculate metrics
            const metrics = ctx.measureText(text);
            const textWidth = metrics.width;
            const textHeight = size; 
            const padding = Math.max(20, canvas.width * 0.03);

            // Set alignment defaults
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';

            if (pos === 'tiled') {
                const diag = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(-Math.PI / 4); 
                
                const xStep = textWidth + padding * 3;
                const yStep = textHeight * 3.5;
                
                for (let y = -diag; y < diag; y += yStep) {
                    const rowOffset = (Math.round((y + diag) / yStep) % 2 === 0) ? 0 : (xStep / 2);
                    for (let x = -diag; x < diag; x += xStep) {
                        ctx.fillText(text, x + rowOffset, y);
                    }
                }
                ctx.restore();
            } else if (pos === 'custom') {
                // If custom position, center it exactly where the mouse is
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';
                ctx.fillText(text, customX, customY);
            } else {
                let x = 0;
                let y = 0;

                switch (pos) {
                    case 'top-left':
                        x = padding;
                        y = padding;
                        break;
                    case 'top-right':
                        x = canvas.width - textWidth - padding;
                        y = padding;
                        break;
                    case 'bottom-left':
                        x = padding;
                        y = canvas.height - textHeight - padding;
                        break;
                    case 'bottom-right':
                        x = canvas.width - textWidth - padding;
                        y = canvas.height - textHeight - padding;
                        break;
                    case 'center':
                        x = (canvas.width - textWidth) / 2;
                        y = (canvas.height - textHeight) / 2;
                        break;
                }
                ctx.fillText(text, x, y);
            }

            // Reset context settings to prevent bleeding into next render frame
            ctx.globalAlpha = 1.0;
            ctx.shadowColor = 'transparent';
            ctx.globalCompositeOperation = 'source-over';
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            // Calculate scale based on actual display size vs internal resolution
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            
            // Handle touch events
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handleDragStart(e) {
            if (uploadedImages.length === 0) return;
            isDragging = true;
            
            // Auto-switch to custom position mode when user touches canvas
            if (position.value !== 'custom') {
                position.value = 'custom';
            }
            
            const pos = getMousePos(e);
            customX = pos.x;
            customY = pos.y;
            updateCanvas();
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            
            // Prevent scrolling while dragging watermark on mobile
            if(e.type === 'touchmove') e.preventDefault();
            
            const pos = getMousePos(e);
            customX = pos.x;
            customY = pos.y;
            updateCanvas();
        }

        function handleDragEnd() {
            isDragging = false;
        }

        // Attach drag events to Canvas
        canvas.addEventListener('mousedown', handleDragStart);
        canvas.addEventListener('mousemove', handleDragMove);
        window.addEventListener('mouseup', handleDragEnd);
        
        canvas.addEventListener('touchstart', handleDragStart, {passive: false});
        canvas.addEventListener('touchmove', handleDragMove, {passive: false});
        window.addEventListener('touchend', handleDragEnd);

        function renderThumbnails() {
            thumbnailContainer.innerHTML = '';
            if (uploadedImages.length <= 1) {
                thumbnailContainer.classList.add('hidden');
            } else {
                thumbnailContainer.classList.remove('hidden');
                uploadedImages.forEach((item, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = `w-16 h-16 rounded-lg cursor-pointer bg-cover bg-center flex-shrink-0 transition-all duration-200 border-2 ${index === currentImageIndex ? 'border-indigo-500 scale-105 shadow-md' : 'border-transparent opacity-60 hover:opacity-100'}`;
                    thumb.style.backgroundImage = `url(${item.src})`;
                    thumb.onclick = () => {
                        currentImageIndex = index;
                        setupCanvasForCurrentImage();
                        renderThumbnails();
                    };
                    thumbnailContainer.appendChild(thumb);
                });
            }
        }

        function setupCanvasForCurrentImage() {
            if (uploadedImages.length === 0) return;
            const img = uploadedImages[currentImageIndex].img;
            
            canvas.width = img.width;
            canvas.height = img.height;
            
            // Initialize custom position to center for new images
            customX = canvas.width / 2;
            customY = canvas.height / 2;

            updateCanvas();
        }

        function processFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // Downscale massive images to prevent browser crashing
                        const MAX_DIMENSION = 3000;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                            const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }
                        
                        // Save a scaled version into memory
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = width;
                        tempCanvas.height = height;
                        const tCtx = tempCanvas.getContext('2d');
                        tCtx.drawImage(img, 0, 0, width, height);
                        
                        const scaledImg = new Image();
                        scaledImg.onload = () => {
                            resolve({
                                img: scaledImg,
                                src: tempCanvas.toDataURL('image/jpeg', 0.8), // Using data URL for thumbnail display
                                originalName: file.name
                            });
                        };
                        scaledImg.src = tempCanvas.toDataURL('image/png');
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleMultipleFiles(files) {
            if (!files || files.length === 0) return;
            
            // Show loading state...
            const originalText = uploadText.textContent;
            uploadText.textContent = "Processing...";
            
            for (let i = 0; i < files.length; i++) {
                try {
                    // Quick check if it might be an image based on native file object
                    const imageObj = await processFile(files[i]);
                    uploadedImages.push(imageObj);
                } catch (e) {
                    console.error("Skipped unreadable file", e);
                }
            }

            if (uploadedImages.length > 0) {
                // Update UI state
                uploadPlaceholder.classList.add('hidden');
                dropZone.classList.remove('border-dashed');
                canvas.classList.remove('hidden');
                removeImageBtn.classList.remove('hidden');
                dragHint.classList.remove('hidden');
                uploadText.textContent = 'Add More Images';
                
                // Show batch download button if multiple files
                if (uploadedImages.length > 1) {
                    downloadAllBtn.classList.remove('hidden');
                    batchCount.textContent = uploadedImages.length;
                } else {
                    downloadAllBtn.classList.add('hidden');
                }

                // Enable controls
                controls.forEach(ctrl => ctrl.removeAttribute('disabled'));
                
                renderThumbnails();
                setupCanvasForCurrentImage();
            } else {
                uploadText.textContent = "Error Loading Images";
                setTimeout(() => uploadText.textContent = originalText, 2000);
            }
        }

        // File Input Handler
        imageUpload.addEventListener('change', (e) => {
            handleMultipleFiles(e.target.files);
            e.target.value = ''; // Reset
        });

        // Clear All Data
        removeImageBtn.addEventListener('click', () => {
            uploadedImages = [];
            currentImageIndex = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 0;
            canvas.height = 0;
            
            // Reset UI state
            uploadPlaceholder.classList.remove('hidden');
            dropZone.classList.add('border-dashed');
            canvas.classList.add('hidden');
            removeImageBtn.classList.add('hidden');
            thumbnailContainer.classList.add('hidden');
            dragHint.classList.add('hidden');
            downloadAllBtn.classList.add('hidden');
            uploadText.textContent = 'Upload Images';
            
            // Disable controls
            controls.forEach(ctrl => ctrl.setAttribute('disabled', 'true'));
        });

        // Drag & Drop Handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
            document.body.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dragOverlay.classList.remove('hidden');
                dropZone.classList.add('border-indigo-500');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dragOverlay.classList.add('hidden');
                dropZone.classList.remove('border-indigo-500');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) {
                handleMultipleFiles(e.dataTransfer.files);
            }
        });

        // Control Listeners
        watermarkText.addEventListener('input', updateCanvas);
        fontFamily.addEventListener('change', updateCanvas);
        blendMode.addEventListener('change', updateCanvas);
        fontColor.addEventListener('input', updateCanvas);
        position.addEventListener('change', updateCanvas);
        
        fontSize.addEventListener('input', (e) => {
            fontSizeDisplay.textContent = `${e.target.value}px`;
            updateCanvas();
        });
        
        opacity.addEventListener('input', (e) => {
            opacityDisplay.textContent = `${e.target.value}%`;
            updateCanvas();
        });

        // Download Logic
        function triggerDownload(fileName) {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        downloadCurrentBtn.addEventListener('click', () => {
            if (uploadedImages.length === 0) return;
            const originalName = uploadedImages[currentImageIndex].originalName.split('.')[0] || 'image';
            triggerDownload(`watermarked_${originalName}_${Date.now()}.png`);
        });

        downloadAllBtn.addEventListener('click', async () => {
            if (uploadedImages.length === 0) return;
            
            // Temporarily disable buttons
            downloadAllBtn.setAttribute('disabled', 'true');
            downloadAllBtn.innerHTML = 'Processing Batch...';

            const startIndex = currentImageIndex;

            // Loop and sequentially download
            for (let i = 0; i < uploadedImages.length; i++) {
                currentImageIndex = i;
                setupCanvasForCurrentImage();
                
                // Slight delay to ensure canvas renders and browser UI doesn't freeze
                await new Promise(r => setTimeout(r, 300));
                
                const originalName = uploadedImages[i].originalName.split('.')[0] || 'image';
                triggerDownload(`watermarked_${originalName}_${Date.now()}.png`);
            }

            // Restore state
            currentImageIndex = startIndex;
            setupCanvasForCurrentImage();
            renderThumbnails();
            
            downloadAllBtn.removeAttribute('disabled');
            downloadAllBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Download All (${uploadedImages.length})
            `;
        });

    </script>
</body>
</html>
